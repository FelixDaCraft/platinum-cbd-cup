services:
  # ============================================
  # Platinum CBD Cup - Next.js app
  # ============================================
  platinum-app:
    image: platinum-cbd-cup:latest
    container_name: platinum-app
    restart: unless-stopped
    depends_on:
      platinum-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Surcharge volontaire du .env : Compose donne la priorité à
      # `environment:` sur `env_file:`. Le .env du homelab contient encore
      # noreply@platinum.aynn.fr, un sous-domaine que Resend n'a jamais
      # vérifié (seul aynn.fr l'était) — tous les envois partaient en 403
      # « domain is not verified », erreur étouffée par Better Auth.
      # platinumcbdcup.eu est vérifié depuis le 23/09. À supprimer d'ici le
      # jour où la même valeur sera posée directement dans le .env.
      - EMAIL_FROM=Platinum CBD Cup <noreply@platinumcbdcup.eu>
    volumes:
      - ./uploads:/app/public/uploads
    networks:
      - platinum-internal
    ports:
      # Exposed on 127.0.0.1:3017 so only Cloudflare Tunnel (on the host) can
      # reach it. The tunnel maps platinumcbdcup.eu -> http://localhost:3017.
      - "127.0.0.1:3017:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Postgres 16
  # ============================================
  platinum-postgres:
    image: postgres:16-alpine
    container_name: platinum-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-platinum}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-platinum_cbd_cup}
    volumes:
      - platinum-pgdata:/var/lib/postgresql/data
    networks:
      - platinum-internal
    ports:
      # Bind to localhost only so the self-hosted GitHub runner (on the same
      # host) can run migrations. Not reachable from the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  platinum-pgdata:

networks:
  platinum-internal:
    driver: bridge
